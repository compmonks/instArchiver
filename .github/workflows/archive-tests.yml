name: Archive integrity tests

on:
  pull_request:
  push:
    branches: [main, 'maintenance/**']

permissions:
  contents: read

concurrency:
  group: archive-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install existing runtime dependency
        run: python -m pip install requests
      - name: Run offline regressions
        env:
          IG_USER_ID: ''
          IG_ACCESS_TOKEN: ''
        run: python -m unittest discover -s tests -v
